services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql

  backend:
    image: ghcr.io/baghaztra/backend:latest
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SQLALCHEMY_DATABASE_URL: "mysql+mysqlconnector://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
    volumes:
      - /home/baghaztra/penjahit-yan/uploads:/app/uploads
      - /home/baghaztra/penjahit-yan/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      - mysql

volumes:
  mysql_data:
