name: "Deploy Service (Template)"

on:
  workflow_call:
    inputs:
      service_name:
        description: "docker-compose service name"
        required: true
        type: string
      context_dir:
        description: "Docker build context directory"
        required: true
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile relative to repo root"
        required: true
        type: string
      image_name:
        description: "GHCR image repository name"
        required: true
        type: string
      image_tag:
        description: "Docker image tag"
        required: true
        type: string
      project_dir:
        description: "Target directory on the VPS"
        required: true
        type: string
      compose_file:
        description: "docker-compose file name"
        required: true
        type: string
      health_check_url:
        description: "URL to curl after deploy (leave empty to skip)"
        required: false
        type: string
        default: ""
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true

concurrency:
  group: deploy-${{ inputs.service_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push (${{ inputs.service_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_dir }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ inputs.service_name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create project directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 60s
          script: |
            set -e
            mkdir -p ${{ inputs.project_dir }}

      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./${{ inputs.compose_file }}"
          target: "${{ inputs.project_dir }}"

      - name: Deploy Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ${{ inputs.project_dir }}
            echo "Pulling ${{ inputs.service_name }} image..."
            success=false
            for i in 1 2 3; do
              if docker compose -f ${{ inputs.compose_file }} pull ${{ inputs.service_name }}; then
                success=true
                break
              fi
              echo "Pull failed (attempt $i/3), retrying in 5s..."
              sleep 5
            done
            if [ "$success" = "false" ]; then
              echo "Failed to pull image after 3 attempts."
              exit 1
            fi
            echo "Starting ${{ inputs.service_name }} service..."
            docker compose -f ${{ inputs.compose_file }} up -d --no-deps ${{ inputs.service_name }}
            echo "${{ inputs.service_name }} deployed successfully."
            docker image prune -af || true

      - name: Health check
        if: inputs.health_check_url != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "Waiting for ${{ inputs.service_name }} to become healthy..."
            for i in $(seq 1 10); do
              if curl -fsS "${{ inputs.health_check_url }}" > /dev/null; then
                echo "${{ inputs.service_name }} is healthy."
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 3s..."
              sleep 3
            done
            echo "${{ inputs.service_name }} failed health check after deploy."
            exit 1
