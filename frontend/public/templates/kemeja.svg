<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Template sketsa kemeja</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Outline kemeja untuk digunakan sebagai template sketsa pakaian</desc>

  

  <!-- Body kemeja -->
  <path d="&#10;    M 240 100&#10;    L 200 80&#10;    L 140 120&#10;    L 120 200&#10;    L 130 380&#10;    L 550 380&#10;    L 560 200&#10;    L 540 120&#10;    L 480 80&#10;    L 440 100&#10;    Q 420 140 340 140&#10;    Q 260 140 240 100&#10;    Z&#10;  " style="fill:rgb(249, 250, 251);stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Kerah kiri -->
  <path d="M 240 100 Q 300 150 340 155 L 340 200" style="fill:none;stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Kerah kanan -->
  <path d="M 440 100 Q 380 150 340 155 L 340 200" style="fill:none;stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lipatan kerah kiri -->
  <path d="M 240 100 Q 290 120 320 145" style="fill:none;stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Lipatan kerah kanan -->
  <path d="M 440 100 Q 390 120 360 145" style="fill:none;stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lengan kiri -->
  <path d="&#10;    M 140 120&#10;    L 80 150&#10;    L 60 240&#10;    L 80 260&#10;    L 120 200&#10;    Z&#10;  " style="fill:rgb(249, 250, 251);stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Lengan kanan -->
  <path d="&#10;    M 540 120&#10;    L 600 150&#10;    L 620 240&#10;    L 600 260&#10;    L 560 200&#10;    Z&#10;  " style="fill:rgb(249, 250, 251);stroke:rgb(75, 85, 99);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

